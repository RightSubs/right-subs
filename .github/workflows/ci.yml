# Unit tests (addon + app) on every pull request and every push to main, in the same container
# as local runs (sh test.sh). No secrets: pull requests from forks run here safely.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The build image (~3 GB of SDK/NDK) is cached between runs.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker
          tags: rightsubs-apk-builder
          load: true
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Unit tests
        run: SKIP_IMAGE_BUILD=1 sh test.sh
