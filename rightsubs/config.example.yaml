# RightSubs configuration. Copy it to config.yaml and adjust:  cp config.example.yaml config.yaml
# Secrets live in .env and are referenced here as ${VARIABLE_NAME}.
# After editing, validate with:  npm run check-config
# Every option explained: docs/CONFIGURATION.md

server:
  host: 127.0.0.1        # only this device reaches the addon
  port: 7000

languages:
  primary: pt-BR         # the language you want to watch in
  secondary: en-US       # used when there is no subtitle in the primary
  useSecondaryWhen:      # not_found = no subtitle in the primary
    - not_found          # (low_confidence: accepted, but has no effect yet)

# Subtitle sources, in order of priority.
# Any Stremio subtitle addon can be added with type: stremio-addon + its manifest url.
providers:
  - id: opensubtitles-api
    type: opensubtitles-api
    enabled: true
    apiKey: ${OPENSUBTITLES_API_KEY}
    username: ${OPENSUBTITLES_USER}
    password: ${OPENSUBTITLES_PASSWORD}
    downloadVia: opensubtitles-v3   # downloads through the v3 addon (no quota) when possible

  - id: opensubtitles-v3
    type: stremio-addon
    enabled: true
    url: https://opensubtitles-v3.strem.io/manifest.json

  # - id: subdl
  #   type: stremio-addon
  #   enabled: true
  #   url: <manifest URL of the SubDL addon>

# Stream indexers (Torrentio, Sootio…) already set up with Real-Debrid.
# RightSubs returns each one's list unchanged and notes which file is playing
# (to read its fps and embedded tracks). Once enabled, uninstall them from Stremio.
# URLs in .env (they carry the RD key). Set enabled to true after filling them in.
streams:
  indexers:
    - id: torrentio
      enabled: false
      url: ${TORRENTIO_URL}
    - id: sootio
      enabled: false
      url: ${SOOTIO_URL}
  # Companion mode: Torrentio/Sootio stay installed in Stremio (indexers above disabled)
  # and RightSubs finds the file that is playing in the Real-Debrid download history.
  # Token in .env (RD_TOKEN). Set enabled to true after filling it in.
  realdebrid:
    enabled: false
    token: ${RD_TOKEN}
  # Torrents without Real-Debrid: Stremio downloads through its own streaming server on the
  # same device, and RightSubs reads the file's fps from there (not the embedded subtitle,
  # so as not to take bandwidth from the video). Only works if RightSubs runs on Stremio's device.
  stremio:
    enabled: false
    url: http://127.0.0.1:11470

sync:
  enabled: true
  budgetSeconds: 15      # how long to wait for syncing before serving the best available
  minConfidence: 0.7     # below this, the sync is considered uncertain
  # Only for syncing, never shown: subtitles made for the exact file (or the same version of
  # the movie) in these languages serve as reference, and the embedded track in these
  # languages is preferred. Most exact subtitles are in English. [] = only the languages above.
  referenceLanguages: [en]
  embedded:              # text subtitle embedded in the file as reference (reads a few stretches of the video over the network)
    enabled: true
    windows: 3           # stretches read (in the parts with the most dialogue)
    windowSeconds: 45    # length of each stretch: ~4 s and ~40 MB on a 4K file (nothing is written to disk)
  audio:
    samples: 8           # audio stretches analyzed per file
    sampleSeconds: 45    # length of each stretch

# Last resort: with no subtitle in the primary or secondary language, translates with DeepL a
# subtitle in ANY language, but only if its timing is confirmed (6 stretches of the embedded
# track, checked in both halves; subtitles made for another cut are refused); the translation
# is cached. Key in .env (DEEPL_API_KEY). Set enabled to true after filling it in.
# More in docs/DEEPL-TRANSLATION.md.
# forceFrom: [en]   # TESTING ONLY: always translates, only from these languages, even with an existing subtitle
translation:
  deepl:
    enabled: false
    apiKey: ${DEEPL_API_KEY}

# Resource use on the device: RightSubs only works when Stremio asks.
resources:
  idleAfterMinutes: 10   # no Stremio request for this long → frees memory and clears temporary files
  maxIdleMemoryMB: 80    # if still above this when idle, restarts clean
  maxConcurrentJobs: 1   # simultaneous syncs (TV boxes have modest CPUs)
  lowPriority: true      # the service and ffmpeg always yield CPU to Stremio

cache:
  dir: ~/.rightsubs/cache
  maxSizeMB: 50          # subtitles are ~50–100 KB: hundreds of movies fit
  maxAgeDays: 10         # subtitles unused for longer are deleted

log:
  level: info            # debug | info | warn | error
