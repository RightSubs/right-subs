# Configuração do RightSubs. Copie para config.yaml e ajuste:  cp config.example.yaml config.yaml
# Segredos ficam no .env e são referenciados aqui como ${NOME_DA_VARIAVEL}.
# Depois de editar, valide com:  npm run check-config
# Explicação de cada opção: docs/CONFIGURACAO.md

server:
  host: 127.0.0.1        # só a própria box acessa o addon
  port: 7000

languages:
  primary: pt-BR         # idioma que você quer ver
  secondary: en-US       # usado quando não existe legenda no principal
  useSecondaryWhen:      # not_found = principal não existe
    - not_found          # (low_confidence: aceito, mas só terá efeito com a fase 4)

# Fontes de legenda, em ordem de prioridade.
# Qualquer addon de legendas do Stremio pode entrar com type: stremio-addon + url do manifest.
providers:
  - id: opensubtitles-api
    type: opensubtitles-api
    enabled: true
    apiKey: ${OPENSUBTITLES_API_KEY}
    username: ${OPENSUBTITLES_USER}
    password: ${OPENSUBTITLES_PASSWORD}
    downloadVia: opensubtitles-v3   # baixa pelo addon v3 (sem cota) quando possível

  - id: opensubtitles-v3
    type: stremio-addon
    enabled: true
    url: https://opensubtitles-v3.strem.io/manifest.json

  # - id: subdl
  #   type: stremio-addon
  #   enabled: true
  #   url: <URL do manifest do addon SubDL>

# Indexadores de streams (Torrentio, Sootio…) já configurados com o Real-Debrid.
# O RightSubs devolve a lista de cada um sem alterar nada e anota qual arquivo está
# tocando (para ler fps e faixas embutidas). Depois de ligar, desinstale-os do Stremio.
# URLs no .env (contêm a chave do RD). Mude enabled para true depois de preencher.
streams:
  indexers:
    - id: torrentio
      enabled: false
      url: ${TORRENTIO_URL}
    - id: sootio
      enabled: false
      url: ${SOOTIO_URL}
  # Modo complemento: Torrentio/Sootio continuam instalados no Stremio (indexadores acima
  # desligados) e o RightSubs acha o arquivo que está tocando no histórico de downloads
  # do Real-Debrid. Token no .env (RD_TOKEN). Mude enabled para true depois de preencher.
  realdebrid:
    enabled: false
    token: ${RD_TOKEN}
  # Torrent sem Real-Debrid: o Stremio baixa pelo servidor de streaming dele, no mesmo
  # aparelho, e o RightSubs lê o fps do arquivo por ali (não lê a legenda embutida, para
  # não roubar banda do vídeo). Só serve se o RightSubs roda no aparelho do Stremio.
  stremio:
    enabled: false
    url: http://127.0.0.1:11470

sync:
  enabled: true
  budgetSeconds: 15      # quanto esperar a sincronização antes de entregar o melhor disponível
  minConfidence: 0.7     # abaixo disso, a sincronização é considerada incerta
  # Só para sincronizar, nunca aparece na tela: legendas feitas para o arquivo exato (ou a
  # mesma versão do filme) nesses idiomas servem de referência, e a faixa embutida nesses
  # idiomas é a preferida. A maioria das legendas exatas está em inglês. [] = só os idiomas acima.
  referenceLanguages: [en]
  embedded:              # legenda em texto embutida no arquivo como referência (lê alguns trechos do vídeo pela rede)
    enabled: true
    windows: 3           # trechos lidos (nas partes com mais fala)
    windowSeconds: 45    # duração de cada trecho: ~4 s e ~40 MB num 4K (nada é gravado em disco)
  audio:
    samples: 8           # trechos de áudio analisados por arquivo
    sampleSeconds: 45    # duração de cada trecho

# Último recurso: sem legenda no idioma principal nem no secundário, traduz com o DeepL uma
# legenda de QUALQUER idioma, mas só se o tempo dela estiver confirmado (6 trechos da faixa
# embutida, conferidos nas duas metades; legendas feitas para outro corte são recusadas); a
# traduzida fica no cache. Chave no .env (DEEPL_API_KEY). Mude enabled para true depois de
# preencher. Mais em docs/TRADUCAO-DEEPL.md.
# forceFrom: [en]   # SÓ PARA TESTE: traduz sempre, só destes idiomas, mesmo com PT existente
translation:
  deepl:
    enabled: false
    apiKey: ${DEEPL_API_KEY}

# Uso de recursos da box: o RightSubs só trabalha quando o Stremio pede.
resources:
  idleAfterMinutes: 10   # sem pedidos do Stremio por este tempo → libera memória e limpa temporários
  maxIdleMemoryMB: 80    # se ainda estiver acima disso ao ficar ocioso, reinicia limpo
  maxConcurrentJobs: 1   # sincronizações simultâneas (a box tem CPU modesta)
  lowPriority: true      # o serviço e o ffmpeg sempre cedem CPU para o Stremio

cache:
  dir: ~/.rightsubs/cache
  maxSizeMB: 50          # legendas têm ~50–100 KB: cabem centenas de filmes
  maxAgeDays: 10         # legendas não usadas há mais tempo são apagadas

log:
  level: info            # debug | info | warn | error
